<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语词汇量测试 - 牛津标准分级</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh; display:flex; align-items:center; justify-content:center;
  padding: 20px;
}
.container {
  background: #fff; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  width: 100%; max-width: 640px; padding: 40px; position: relative; overflow: hidden;
}
.screen { display: none; }
.screen.active { display: block; }
h1 { font-size: 26px; color: #333; margin-bottom: 8px; text-align: center; }
.subtitle { color: #888; font-size: 14px; text-align: center; margin-bottom: 30px; }
.info-box {
  background: #f0f4ff; border-radius: 12px; padding: 16px 20px; margin-bottom: 24px;
  font-size: 14px; color: #555; line-height: 1.8;
}
.info-box strong { color: #4a5acd; }
.option-group { margin-bottom: 24px; }
.option-label { font-size: 14px; color: #666; margin-bottom: 10px; display: block; font-weight: 500; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.opt-btn {
  padding: 10px 20px; border-radius: 10px; border: 2px solid #e0e0e0; background: #fff;
  font-size: 14px; cursor: pointer; transition: all 0.2s; color: #555;
}
.opt-btn:hover { border-color: #667eea; color: #667eea; }
.opt-btn.selected { border-color: #667eea; background: #667eea; color: #fff; }
.primary-btn {
  width: 100%; padding: 16px; border-radius: 12px; border: none;
  background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
  font-size: 17px; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
}
.primary-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102,126,234,0.4); }
.progress-bar { height: 6px; background: #eee; border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 3px; transition: width 0.3s ease; }
.progress-text { font-size: 13px; color: #999; margin-bottom: 20px; text-align: center; }
.word-card {
  text-align: center; padding: 40px 20px; margin-bottom: 30px;
  background: #fafbff; border-radius: 16px; border: 1px solid #eee;
}
.word-display { font-size: 42px; font-weight: 700; color: #333; margin-bottom: 12px; letter-spacing: 1px; word-break: break-all; }
.level-badge {
  display: inline-block; padding: 4px 14px; border-radius: 20px; font-size: 13px;
  font-weight: 600; margin-top: 8px;
}
.level-A1 { background: #e8f5e9; color: #2e7d32; }
.level-A2 { background: #e3f2fd; color: #1565c0; }
.level-B1 { background: #fff3e0; color: #e65100; }
.level-B2 { background: #fce4ec; color: #c62828; }
.level-C1 { background: #ede7f6; color: #4527a0; }
.level-C2 { background: #263238; color: #ffd54f; }
.answer-btns { display: flex; gap: 16px; }
.answer-btn {
  flex: 1; padding: 18px; border-radius: 14px; border: 2px solid transparent;
  font-size: 17px; font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.btn-know { background: #e8f5e9; color: #2e7d32; }
.btn-know:hover { background: #2e7d32; color: #fff; transform: translateY(-2px); }
.btn-unknown { background: #ffebee; color: #c62828; }
.btn-unknown:hover { background: #c62828; color: #fff; transform: translateY(-2px); }
.result-header { text-align: center; margin-bottom: 24px; }
.vocab-number { font-size: 52px; font-weight: 800; color: #667eea; }
.vocab-label { font-size: 14px; color: #888; margin-top: 4px; }
.cefr-badge {
  display: inline-block; padding: 8px 24px; border-radius: 30px; font-size: 20px;
  font-weight: 700; margin-top: 12px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
}
.mastery-section { margin: 24px 0; }
.mastery-title { font-size: 15px; font-weight: 600; color: #444; margin-bottom: 14px; }
.mastery-row { display: flex; align-items: center; margin-bottom: 10px; }
.mastery-label { width: 36px; font-size: 13px; font-weight: 600; color: #666; }
.mastery-bar { flex: 1; height: 22px; background: #f0f0f0; border-radius: 11px; overflow: hidden; margin: 0 10px; }
.mastery-fill { height: 100%; border-radius: 11px; transition: width 0.6s ease; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; font-size: 11px; color: #fff; font-weight: 600; min-width: 0; }
.mastery-pct { width: 42px; font-size: 13px; color: #666; text-align: right; }
.advice-box {
  background: #fffde7; border-radius: 12px; padding: 16px 20px; margin: 20px 0;
  font-size: 14px; color: #555; line-height: 1.8; border-left: 4px solid #ffd54f;
}
.review-section { margin-top: 20px; max-height: 200px; overflow-y: auto; border: 1px solid #eee; border-radius: 12px; padding: 16px; }
.review-title { font-size: 14px; font-weight: 600; color: #444; margin-bottom: 10px; }
.review-word { display: inline-block; margin: 3px 4px; padding: 3px 10px; border-radius: 6px; font-size: 13px; }
.review-known { background: #e8f5e9; color: #2e7d32; }
.review-unknown { background: #ffebee; color: #c62828; text-decoration: line-through; }
.stats-row { display: flex; justify-content: center; gap: 30px; margin: 16px 0; }
.stat-item { text-align: center; }
.stat-num { font-size: 24px; font-weight: 700; color: #444; }
.stat-label { font-size: 12px; color: #999; margin-top: 2px; }
.footer-note { text-align: center; font-size: 12px; color: #bbb; margin-top: 20px; }
</style>
</head>
<body>
<div class="container">
  <div class="screen active" id="screen-start">
    <h1>英语词汇量测试</h1>
    <p class="subtitle">基于牛津 3000/5000 · CEFR 分级标准</p>
    <div class="info-box">
      <strong>测试说明：</strong><br>
      系统将展示从 A1（入门）到 C2（精通）六个级别的英语单词，请根据你是否认识该单词作答。<br>
      测试结束后，系统将根据各级别的掌握率估算你的词汇量，并给出对应 CEFR 等级与学习建议。
    </div>
    <div class="option-group">
      <span class="option-label">选择题目数量：</span>
      <div class="btn-row" id="num-options">
        <button class="opt-btn" data-num="24">24 题（快速）</button>
        <button class="opt-btn selected" data-num="36">36 题（标准）</button>
        <button class="opt-btn" data-num="48">48 题（详细）</button>
        <button class="opt-btn" data-num="60">60 题（全面）</button>
      </div>
    </div>
    <button class="primary-btn" onclick="startTest()">开始测试</button>
    <div class="footer-note">内置词库：3373 词 · A1-C2 六级覆盖 · 离线可用</div>
  </div>

  <div class="screen" id="screen-test">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-text" id="progress-text"></div>
    <div class="word-card">
      <div class="word-display" id="word-display"></div>
      <div><span class="level-badge" id="level-badge"></span></div>
    </div>
    <div class="answer-btns">
      <button class="answer-btn btn-know" onclick="answer(true)">认识</button>
      <button class="answer-btn btn-unknown" onclick="answer(false)">不认识</button>
    </div>
  </div>

  <div class="screen" id="screen-result">
    <div class="result-header">
      <h1>测试结果</h1>
      <div class="vocab-number" id="vocab-number"></div>
      <div class="vocab-label">估算词汇量</div>
      <div class="cefr-badge" id="cefr-badge"></div>
    </div>
    <div class="stats-row">
      <div class="stat-item"><div class="stat-num" id="stat-total"></div><div class="stat-label">测试单词数</div></div>
      <div class="stat-item"><div class="stat-num" id="stat-known"></div><div class="stat-label">认识</div></div>
      <div class="stat-item"><div class="stat-num" id="stat-unknown"></div><div class="stat-label">不认识</div></div>
    </div>
    <div class="mastery-section">
      <div class="mastery-title">各级别掌握率</div>
      <div id="mastery-bars"></div>
    </div>
    <div class="advice-box" id="advice-box"></div>
    <div class="review-section" id="review-section">
      <div class="review-title">答题回顾</div>
      <div id="review-words"></div>
    </div>
    <br>
    <button class="primary-btn" onclick="resetTest()">重新测试</button>
  </div>
</div>

const LEVELS = ['A1','A2','B1','B2','C1','C2'];
const LEVEL_COLORS = { A1:'#4caf50', A2:'#2196f3', B1:'#ff9800', B2:'#e91e63', C1:'#673ab7', C2:'#37474f' };
const BAND_WIDTH = { A1:1000, A2:1000, B1:1000, B2:1000, C1:1000, C2:3000 };

let testWords = [];
let currentIndex = 0;
let responses = [];
let selectedNum = 36;

document.querySelectorAll('#num-options .opt-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#num-options .opt-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedNum = parseInt(btn.dataset.num);
  });
});

function shuffle(arr) {
  let a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startTest() {
  testWords = generateQuestions(selectedNum);
  currentIndex = 0;
  responses = [];
  showScreen('screen-test');
  renderQuestion();
}

function generateQuestions(n) {
  let questions = [];
  const perLevel = Math.floor(n / LEVELS.length);
  const remainder = n % LEVELS.length;
  for (let i = 0; i < LEVELS.length; i++) {
    const lv = LEVELS[i];
    const pool = VOCAB[lv];
    const count = perLevel + (i < remainder ? 1 : 0);
    const sampled = shuffle(pool).slice(0, count);
    sampled.forEach(w => questions.push({ word: w, level: lv }));
  }
  return shuffle(questions);
}

function renderQuestion() {
  const item = testWords[currentIndex];
  document.getElementById('word-display').textContent = item.word;
  const badge = document.getElementById('level-badge');
  badge.textContent = item.level;
  badge.className = 'level-badge level-' + item.level;
  const pct = (currentIndex / testWords.length) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = '第 ' + (currentIndex + 1) + ' / ' + testWords.length + ' 题';
}

function answer(known) {
  responses.push({ word: testWords[currentIndex].word, level: testWords[currentIndex].level, known: known });
  currentIndex++;
  if (currentIndex < testWords.length) {
    renderQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  const levelStats = {};
  LEVELS.forEach(lv => { levelStats[lv] = { total: 0, known: 0 }; });
  responses.forEach(r => {
    levelStats[r.level].total++;
    if (r.known) levelStats[r.level].known++;
  });
  const mastery = {};
  LEVELS.forEach(lv => {
    mastery[lv] = levelStats[lv].total > 0 ? levelStats[lv].known / levelStats[lv].total : 0;
  });

  let estimated = 0;
  LEVELS.forEach(lv => {
    if (levelStats[lv].total > 0) estimated += mastery[lv] * BAND_WIDTH[lv];
  });
  estimated = Math.round(estimated / 50) * 50;

  let cefr = 'A1';
  if (estimated >= 4500) cefr = 'C2';
  else if (estimated >= 3750) cefr = 'C1';
  else if (estimated >= 3250) cefr = 'B2';
  else if (estimated >= 2500) cefr = 'B1';
  else if (estimated >= 1500) cefr = 'A2';

  const knownCount = responses.filter(r => r.known).length;
  document.getElementById('vocab-number').textContent = '~' + estimated.toLocaleString();
  document.getElementById('cefr-badge').textContent = 'CEFR ' + cefr;
  document.getElementById('stat-total').textContent = responses.length;
  document.getElementById('stat-known').textContent = knownCount;
  document.getElementById('stat-unknown').textContent = responses.length - knownCount;

  let barsHtml = '';
  LEVELS.forEach(lv => {
    const rate = Math.round(mastery[lv] * 100);
    const color = LEVEL_COLORS[lv];
    barsHtml += '<div class="mastery-row">' +
      '<span class="mastery-label">' + lv + '</span>' +
      '<div class="mastery-bar"><div class="mastery-fill" style="width:' + rate + '%;background:' + color + '">' + (rate > 15 ? rate + '%' : '') + '</div></div>' +
      '<span class="mastery-pct">' + rate + '%</span></div>';
  });
  document.getElementById('mastery-bars').innerHTML = barsHtml;

  let advice = '';
  if (estimated < 1500) advice = '建议从 A1-A2 基础词汇入手，每天学习 20-30 个高频词，配合简单阅读材料巩固。';
  else if (estimated < 2500) advice = '基础词汇已有一定积累！建议重点攻克 A2-B1 级别词汇，多读简单英文文章和对话。';
  else if (estimated < 3250) advice = '达到 B1 中级水平！建议挑战 B1-B2 词汇，尝试阅读英文新闻、看带字幕的英文视频。';
  else if (estimated < 3750) advice = '已达 B2 中高级水平！建议拓展学术与专业词汇，阅读原版小说、报刊。';
  else if (estimated < 4500) advice = '优秀！已达 C1 高级水平。建议深入学术词汇与地道表达，进行大量原版阅读。';
  else advice = '词汇量达到 C2 精通级别！建议持续接触专业文献与高阶材料，保持并精进。';
  document.getElementById('advice-box').innerHTML = '<strong>学习建议：</strong><br>' + advice;

  let reviewHtml = '';
  responses.forEach(r => {
    const cls = r.known ? 'review-known' : 'review-unknown';
    reviewHtml += '<span class="review-word ' + cls + '">' + r.word + '</span>';
  });
  document.getElementById('review-words').innerHTML = reviewHtml;

  showScreen('screen-result');
}

function resetTest() { showScreen('screen-start'); }

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
</script>
