<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语900句听力练习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .progress-bar {
            background: #f0f0f0;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea, #764ba2);
            height: 100%;
            transition: width 0.3s ease;
            border-radius: 4px;
        }

        .progress-text {
            text-align: center;
            color: #666;
            font-size: 0.9em;
            margin-bottom: 30px;
        }

        .sentence-number {
            color: #667eea;
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        .audio-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-play {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            flex: 1;
        }

        .btn-repeat {
            background: #f0f0f0;
            color: #333;
        }

        .btn-toggle {
            background: #4CAF50;
            color: white;
            width: 100%;
        }

        .btn-toggle.hidden {
            background: #2196F3;
        }

        .navigation {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-nav {
            flex: 1;
            background: #f0f0f0;
            color: #333;
        }

        .btn-nav:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .sentence-display {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 20px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .sentence-text {
            font-size: 1.3em;
            line-height: 1.6;
            color: #333;
        }

        .sentence-hidden {
            color: #999;
            font-style: italic;
        }

        .settings {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .setting-label {
            color: #666;
            font-weight: 500;
        }

        select, input[type="range"] {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
        }

        input[type="range"] {
            width: 150px;
        }

        .shortcuts {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

        .shortcuts h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .shortcuts p {
            color: #666;
            line-height: 1.8;
            font-size: 0.9em;
        }

        .import-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            margin-bottom: 10px;
        }

        .btn-import {
            background: #FF9800;
            color: white;
            width: 100%;
        }

        .status {
            text-align: center;
            color: #4CAF50;
            font-weight: 500;
            margin-top: 10px;
            min-height: 20px;
        }

        @media (max-width: 600px) {
            .card {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            button {
                padding: 12px 20px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎧 英语900句听力练习</h1>
            <p>Listen, Learn, Master</p>
        </div>

        <div class="card">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">准备开始</div>

            <div class="sentence-number" id="sentenceNumber">句子 1</div>

            <div class="sentence-display">
                <div class="sentence-text sentence-hidden" id="sentenceDisplay">
                    点击"播放"开始听力练习
                </div>
            </div>

            <div class="audio-controls">
                <button class="btn-play" id="btnPlay">▶️ 播放</button>
                <button class="btn-repeat" id="btnRepeat">🔄 重播</button>
            </div>

            <button class="btn-toggle" id="btnToggle">👁️ 显示原文</button>

            <div class="navigation">
                <button class="btn-nav" id="btnPrev">⬅️ 上一句</button>
                <button class="btn-nav" id="btnNext">下一句 ➡️</button>
            </div>

            <div class="settings">
                <h3 style="color: #667eea; margin-bottom: 15px;">⚙️ 设置</h3>

                <div class="setting-row">
                    <span class="setting-label">语速</span>
                    <input type="range" id="rateControl" min="0.5" max="1.5" step="0.1" value="0.9">
                    <span id="rateValue">0.9x</span>
                </div>

                <div class="setting-row">
                    <span class="setting-label">音量</span>
                    <input type="range" id="volumeControl" min="0" max="1" step="0.1" value="1">
                    <span id="volumeValue">100%</span>
                </div>

                <div class="setting-row">
                    <span class="setting-label">发音</span>
                    <select id="voiceSelect">
                        <option value="">默认英语</option>
                    </select>
                </div>
            </div>

            <div class="import-section">
                <h3 style="color: #667eea; margin-bottom: 15px;">📝 导入句子</h3>
                <textarea id="importText" placeholder="将英语句子粘贴到这里，每行一句...&#10;例如：&#10;Hello, how are you?&#10;Good morning!&#10;What's your name?"></textarea>
                <button class="btn-import" id="btnImport">导入句子</button>
                <div class="status" id="importStatus"></div>
            </div>

            <div class="shortcuts">
                <h3>⌨️ 快捷键</h3>
                <p>
                    <strong>空格</strong> - 播放/暂停 |
                    <strong>R</strong> - 重播 |
                    <strong>S</strong> - 显示/隐藏原文 |
                    <strong>←</strong> - 上一句 |
                    <strong>→</strong> - 下一句
                </p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
