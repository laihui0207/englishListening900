version: '3.8'

services:
  english-listening:
    image: docker.huivip.com.cn:8580/english-listening:v3.3
    container_name: english-listening-practice
    ports:
      - "8888:3000"
    restart: unless-stopped
    # 持久化数据库（用户账号与学习进度）
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - DB_PATH=/app/data/app.db
    labels:
      - "com.example.description=英语900句听力练习网站"
      - "com.example.version=3.3"
